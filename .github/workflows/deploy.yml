name: Publish costume contest

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Prepare live configuration
        id: config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: python3 scripts/prepare_deploy.py

      - name: Install app dependencies
        run: flutter pub get

      - name: Check Dart code
        run: flutter analyze

      - name: Test the app
        run: flutter test

      - name: Build the live website
        env:
          BASE_HREF: ${{ steps.config.outputs.base_href }}
          CONFIG_FILE: ${{ steps.config.outputs.config_file }}
        run: flutter build web --release --no-web-resources-cdn --base-href "$BASE_HREF" --dart-define-from-file "$CONFIG_FILE"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
