<!DOCTYPE html>
<html lang="de">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#142b28">
  <meta name="description" content="Registriere dein Kostüm und stimme für drei verschiedene Kostüme ab. Nur der Veranstalter sieht die Ergebnisse.">
  <title>Costume Club · Kostümwettbewerb</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    body { margin: 0; background: #f7f5ef; color: #142b28; }
    #loading { min-height: 100dvh; display: grid; place-content: center; text-align: center; font-family: system-ui, sans-serif; }
    #loading h1 { font-size: 28px; letter-spacing: -1px; }
    #loading p { color: #596761; font-size: 15px; }
    .mark { font-size: 44px; }
  </style>
</head>
<body>
  <div id="loading" role="status"><div class="mark">✦</div><h1>Costume Club</h1><p>Seite wird geladen…</p></div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
